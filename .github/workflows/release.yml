name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            suffix: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/padagonia${{ matrix.suffix }}" \
             "dist/padagonia-${{ matrix.target }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: padagonia-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx
          cargo cyclonedx --format json
          sbom_path="$(find . -maxdepth 1 -type f \( -name '*.cdx.json' -o -name 'bom.json' \) -print -quit)"
          test -n "$sbom_path"
          mv "$sbom_path" dist/padagonia.cdx.json
      - name: Generate SHA-256 manifest
        working-directory: dist
        run: sha256sum padagonia-* > SHA256SUMS
      - name: Attest binaries and SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: dist/padagonia.cdx.json
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
