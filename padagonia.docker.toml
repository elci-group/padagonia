# PADAGONIA configuration tuned for the official Docker image.
# The listen address is bound to all interfaces so the container port can be
# exposed to the host and to orchestrators.

[server]
listen_addr = "0.0.0.0:7373"
# Required at runtime via PADAGONIA__SERVER__API_KEY. The empty checked-in
# value deliberately makes startup fail closed when no secret is supplied.
api_key = ""
data_dir = "/var/lib/padagonia/data/store.pad"

[storage]
data_dir = "/var/lib/padagonia/data"
default_graph = "graph.pad"

[logging]
level = "info"

[hnsw]
m = 16
ef_construction = 200
ef = 50

[limits]
request_body_bytes = 1048576
request_timeout_seconds = 30
requests_per_second = 100
request_burst = 200
max_ingest_nodes = 100000
max_ingest_edges = 500000
max_bfs_depth = 64
max_vector_dimensions = 4096
max_vector_results = 1000
max_vector_ef = 10000
